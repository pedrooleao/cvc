<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c1c1c">
<title>Modo Avião · CVC</title>
<meta name="description" content="A única conexão que você precisa é com Deus. Comunidade de Vida Cristã Bruxelas.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600;8..60,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f4f1;
    --ink: #161616;
    --text: #1e2a44;
    --muted: #55607a;
    --line: #2b3f6b;
    --header: #1c1c1c;
    --peach: #e9a48c;
    --peach-soft: #f6d3c2;
    --blue: #1f8fd0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Figtree", system-ui, sans-serif;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  header {
    position: relative; z-index: 2;
    background: var(--header);
    color: #fff;
    display: flex; align-items: center; justify-content: center; gap: 12px;
    padding: 16px;
  }
  header svg { width: 38px; height: 38px; }
  header .brand { line-height: 1.1; text-align: left; }
  header .brand small { display: block; font-size: 8px; letter-spacing: .35em; text-transform: uppercase; opacity: .85; }
  header .brand span { font-family: "Source Serif 4", Georgia, serif; font-style: italic; font-size: 20px; }

  canvas#bg { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; }

  main {
    position: relative; z-index: 1;
    min-height: calc(100svh - 70px);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center;
    padding: 40px 16px 56px;
    gap: 26px;
  }

  /* barras de sinal que vão sumindo */
  .signal { display: flex; align-items: flex-end; gap: 5px; height: 34px; }
  .signal span {
    width: 7px; border-radius: 2px; background: var(--ink);
    animation: fade 4s ease-in-out infinite;
  }
  .signal span:nth-child(1) { height: 25%;  animation-delay: 1.5s; }
  .signal span:nth-child(2) { height: 50%;  animation-delay: 1s; }
  .signal span:nth-child(3) { height: 75%;  animation-delay: .5s; }
  .signal span:nth-child(4) { height: 100%; animation-delay: 0s; }
  @keyframes fade {
    0%, 15%  { opacity: .9; }
    45%, 80% { opacity: .1; }
    100%     { opacity: .9; }
  }

  h1 {
    font-family: "Source Serif 4", Georgia, serif;
    font-weight: 800;
    font-size: clamp(44px, 11vw, 112px);
    line-height: 1.02;
    letter-spacing: -.01em;
    max-width: 11em;
    opacity: 0; animation: rise 1.2s .3s ease-out forwards;
  }
  h1 em { font-style: normal; position: relative; white-space: nowrap; }
  h1 em::after {
    content: ""; position: absolute; left: -2%; right: -2%; bottom: .08em; height: .18em;
    background: var(--peach-soft); z-index: -1; border-radius: 4px;
    transform-origin: left; transform: scaleX(0);
    animation: underline 1s 1.4s ease-out forwards;
  }
  @keyframes underline { to { transform: scaleX(1); } }

  .signature {
    display: flex; align-items: center; justify-content: center; gap: 18px;
    font-size: clamp(11px, 3vw, 17px); font-weight: 500;
    letter-spacing: .14em; text-transform: uppercase; color: var(--ink);
    opacity: 0; animation: rise 1.2s .8s ease-out forwards;
  }
  .signature i { width: clamp(40px, 12vw, 150px); height: 1px; background: var(--line); }

  .lead {
    font-size: clamp(17px, 4.4vw, 21px);
    line-height: 1.6;
    color: var(--text);
    max-width: 30em;
    opacity: 0; animation: rise 1.2s 1.1s ease-out forwards;
  }

  .plane-card {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 18px 14px 14px;
    background: #fff;
    border: 1px solid #e6e3dd;
    border-radius: 14px;
    box-shadow: 0 10px 30px rgba(30,42,68,.08);
    cursor: pointer; user-select: none;
    transition: box-shadow .3s, transform .3s;
    opacity: 0; animation: rise 1.2s 1.5s ease-out forwards;
  }
  .plane-card:hover { box-shadow: 0 14px 40px rgba(30,42,68,.14); }
  .plane-icon {
    width: 46px; height: 46px; border-radius: 50%;
    display: grid; place-items: center;
    background: #efede8;
    transition: background .4s;
  }
  .plane-icon svg { width: 24px; height: 24px; fill: var(--ink); transition: fill .4s, transform .6s; }
  .plane-text { text-align: left; }
  .plane-text b { display: block; font-size: 17px; font-weight: 600; }
  .plane-text small { color: var(--muted); font-size: 13px; }
  .toggle {
    width: 52px; height: 30px; border-radius: 999px; margin-left: 6px; flex: none;
    background: #d9d6cf; position: relative; transition: background .4s;
  }
  .toggle::after {
    content: ""; position: absolute; top: 3px; left: 3px;
    width: 24px; height: 24px; border-radius: 50%; background: #fff;
    box-shadow: 0 1px 3px rgba(0,0,0,.2);
    transition: transform .4s cubic-bezier(.3,1.4,.5,1);
  }
  .plane-card.on .toggle { background: #f29a38; }
  .plane-card.on .toggle::after { transform: translateX(22px); }
  .plane-card.on .plane-icon { background: #f29a38; }
  .plane-card.on .plane-icon svg { fill: #fff; transform: rotate(-12deg) translateY(-2px); }

  .thanks { font-size: 15px; color: var(--text); min-height: 1.5em; }

  .verse {
    max-width: 34em;
    color: var(--muted);
    font-size: 16px; line-height: 1.6; letter-spacing: .03em;
    opacity: 0; animation: rise 1.2s 1.9s ease-out forwards;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(18px); filter: blur(6px); }
    to   { opacity: 1; transform: none; filter: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0s !important; }
  }
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>

<header>
  <svg viewBox="0 0 40 40" fill="none" stroke="#fff" stroke-width="1.6" aria-hidden="true">
    <circle cx="20" cy="20" r="18"/>
    <path d="M20 7v27M13 15h14" stroke-linecap="round"/>
  </svg>
  <div class="brand"><small>Comunidade de</small><span>Vida Cristã</span></div>
</header>

<main>
  <div class="signal" aria-hidden="true"><span></span><span></span><span></span><span></span></div>

  <h1>Desconecte-se.<br>Conecte-se com <em>Deus</em>.</h1>

  <div class="signature"><span>Ative o modo avião</span><i></i><span>✈</span></div>

  <p class="lead">A única conexão que você precisa agora é com Deus. Guarde o celular, ligue o modo avião e esteja presente.</p>

  <div class="plane-card" id="plane" role="switch" aria-checked="false" tabindex="0">
    <div class="plane-icon">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/></svg>
    </div>
    <div class="plane-text">
      <b>Modo avião</b>
      <small>Toque para se desconectar</small>
    </div>
    <div class="toggle" aria-hidden="true"></div>
  </div>

  <p class="thanks" id="thanks" aria-live="polite"></p>

  <p class="verse">“Aquietai-vos e sabei que eu sou Deus.” — Salmos 46:10</p>
</main>

<script>
(() => {
  const canvas = document.getElementById("bg");
  const ctx = canvas.getContext("2d");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let w, h, dpr, blobs, motes;

  // manchas suaves nos tons do site (pêssego do livro e azul da foto)
  const palette = [
    [233, 164, 140], [246, 211, 194], [31, 143, 208], [190, 220, 240], [242, 154, 56]
  ];

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = canvas.width = innerWidth * dpr;
    h = canvas.height = innerHeight * dpr;
    const m = Math.max(w, h);
    blobs = palette.map((c, i) => ({
      c, r: m * (.28 + Math.random() * .18),
      x: Math.random() * w, y: Math.random() * h,
      sx: .00007 + Math.random() * .00008, sy: .00006 + Math.random() * .00008,
      p: i * 1.7, a: i === 2 ? .16 : .32
    }));
    motes = Array.from({ length: Math.round(innerWidth * innerHeight / 22000) + 15 }, newMote);
  }

  function newMote(initial) {
    return {
      x: Math.random() * w,
      y: initial === true ? Math.random() * h : h + 10,
      r: (Math.random() * 1.8 + .6) * dpr,
      vy: -(Math.random() * .3 + .1) * dpr,
      d: Math.random() * Math.PI * 2,
      a: Math.random() * .35 + .15
    };
  }

  function draw(t) {
    ctx.clearRect(0, 0, w, h);

    for (const b of blobs) {
      const x = w / 2 + Math.sin(t * b.sx + b.p) * w * .45;
      const y = h / 2 + Math.cos(t * b.sy + b.p) * h * .4;
      const g = ctx.createRadialGradient(x, y, 0, x, y, b.r);
      g.addColorStop(0, `rgba(${b.c},${b.a})`);
      g.addColorStop(1, `rgba(${b.c},0)`);
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, w, h);
    }

    // grande círculo de luz, como o recorte circular do site
    const pulse = 1 + Math.sin(t / 3000) * .03;
    const cr = Math.min(w, h) * .42 * pulse;
    const cg = ctx.createRadialGradient(w / 2, h * .42, cr * .6, w / 2, h * .42, cr);
    cg.addColorStop(0, "rgba(255,255,255,.55)");
    cg.addColorStop(1, "rgba(255,255,255,0)");
    ctx.fillStyle = cg;
    ctx.beginPath(); ctx.arc(w / 2, h * .42, cr, 0, Math.PI * 2); ctx.fill();

    for (let i = 0; i < motes.length; i++) {
      const m = motes[i];
      m.y += m.vy; m.d += .01; m.x += Math.sin(m.d) * .25 * dpr;
      if (m.y < -10) motes[i] = newMote();
      ctx.globalAlpha = m.a;
      ctx.fillStyle = "#c98a6c";
      ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    if (!reduce) requestAnimationFrame(draw);
  }

  addEventListener("resize", resize);
  resize();
  motes = motes.map(() => newMote(true));
  requestAnimationFrame(draw);

  const plane = document.getElementById("plane");
  const thanks = document.getElementById("thanks");
  function toggle() {
    const on = plane.classList.toggle("on");
    plane.setAttribute("aria-checked", on);
    thanks.textContent = on ? "Desconectado do mundo, conectado com Ele. 🙏" : "";
    if (on && navigator.vibrate) navigator.vibrate(30);
  }
  plane.addEventListener("click", toggle);
  plane.addEventListener("keydown", e => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); }
  });
})();
</script>
</body>
</html>
