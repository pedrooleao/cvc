<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR Modo Avião · CVC</title>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --bg: #f5f4f1; --ink: #161616; --text: #1e2a44; --line: #2b3f6b; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100svh;
    background: var(--bg); color: var(--ink);
    font-family: "Figtree", system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 24px; padding: 32px 16px; text-align: center;
  }
  h1 {
    font-family: "Source Serif 4", Georgia, serif; font-weight: 800;
    font-size: clamp(36px, 8vw, 72px); line-height: 1.05;
  }
  p { color: var(--text); font-size: 18px; max-width: 26em; line-height: 1.5; }
  #qr {
    background: #fff; padding: 20px; border-radius: 18px;
    box-shadow: 0 14px 40px rgba(30,42,68,.12);
  }
  #qr svg { display: block; width: min(70vw, 340px); height: auto; }
  .signature {
    display: flex; align-items: center; gap: 16px;
    font-size: 14px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase;
  }
  .signature i { width: 80px; height: 1px; background: var(--line); }
  @media (max-width: 480px) {
    .signature { font-size: 11px; gap: 10px; white-space: nowrap; }
    .signature i { width: 32px; }
  }
  .url { font-size: 12px; color: #7a8297; word-break: break-all; }
  button {
    font: inherit; font-weight: 600; cursor: pointer;
    padding: 14px 28px; border: 0; background: #1c1c1c; color: #fff;
  }
  @media print {
    body { background: #fff; }
    #qr { box-shadow: none; }
    button, .url { display: none; }
  }
</style>
</head>
<body>
  <h1>Desconecte-se.<br>Conecte-se com Deus.</h1>
  <p>Aponte a câmera do celular para o código ✈</p>
  <div id="qr"></div>
  <div class="signature"><span>Comunidade de Vida Cristã</span><i></i><span>Bruxelas</span></div>
  <span class="url" id="url"></span>
  <button onclick="print()">Imprimir</button>

<script src="vendor/qrcode.js"></script>
<script>
  // Usa ?url=... se informado; senão aponta para a página principal deste mesmo site.
  const target = new URLSearchParams(location.search).get("url")
    || new URL("./", location.href).href;
  document.getElementById("url").textContent = target;
  const qr = qrcode(0, "H");
  qr.addData(target);
  qr.make();
  document.getElementById("qr").innerHTML = qr.createSvgTag({ cellSize: 10, margin: 0, scalable: true });
</script>
</body>
</html>
